name: Validate config

# config.yaml drives every build; a malformed file fails the deploy (issue #9).
# PRs are checked before merge; pushes to main catch direct edits. Commits the
# add-ticker bot pushes don't trigger workflows (GITHUB_TOKEN), so that job
# runs the same validator itself before pushing.
on:
  pull_request:
    paths:
      - config.yaml
      - scripts/validate_config.py
  push:
    branches:
      - main
    paths:
      - config.yaml
      - scripts/validate_config.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Validate config.yaml
        run: uv run python scripts/validate_config.py
