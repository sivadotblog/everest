name: Add Ticker Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add-ticker:
    # Only run for issues with the add-ticker label
    if: contains(toJSON(github.event.issue.labels), '"add-ticker"')
    runs-on: ubuntu-latest

    # The issue title is attacker-controlled on a public repo, so it and
    # everything derived from it reach shell/JS only through env vars, never
    # ${{ }} interpolation into a script body (which would run `$(...)`).
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Parse ticker from issue title
        id: parse
        run: |
          # Extract everything after "Add ticker:" and strip whitespace
          TICKER=$(echo "$ISSUE_TITLE" | sed 's/.*[Aa]dd [Tt]icker:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d ' \t\r\n')
          echo "ticker=$TICKER" >> "$GITHUB_OUTPUT"
          echo "Parsed ticker: $TICKER"

      - name: Validate and add ticker
        id: validate
        env:
          TICKER: ${{ steps.parse.outputs.ticker }}
        run: uv run python scripts/validate_ticker.py "$TICKER" "$ISSUE_NUMBER"

      # Gate: re-check the file actually written before anything reaches main.
      # (validate_ticker.py already refuses edits outside requested_stocks.)
      - name: Validate config.yaml
        if: steps.validate.outputs.added == 'true'
        run: uv run python scripts/validate_config.py

      - name: Commit config.yaml
        if: steps.validate.outputs.added == 'true'
        env:
          TICKER: ${{ steps.parse.outputs.ticker }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "feat(config): add $TICKER via issue #$ISSUE_NUMBER"
          git push

      - name: Trigger site rebuild
        if: steps.validate.outputs.added == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'refresh_sma_data.yml',
              ref: 'main',
            });

      - name: Comment success
        if: steps.validate.outputs.added == 'true'
        uses: actions/github-script@v7
        env:
          TICKER: ${{ steps.parse.outputs.ticker }}
          NAME: ${{ steps.validate.outputs.name }}
        with:
          script: |
            const { TICKER, NAME } = process.env;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `✅ **${TICKER}** (${NAME}) has been added to the screening universe!`,
                ``,
                `The leaderboard will update automatically within the next few minutes as the [data refresh workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/refresh_sma_data.yml) runs.`,
              ].join('\n')
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'completed',
            });

      # failure() is required: an `if:` without a status function gets an
      # implicit `success() &&`, so the old `added != 'true'` condition was
      # skipped whenever validation failed and rejections went unanswered.
      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        env:
          TICKER: ${{ steps.parse.outputs.ticker }}
          REASON: ${{ steps.validate.outputs.reason }}
        with:
          script: |
            const { TICKER, REASON } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `❌ Could not add **${TICKER}**: ${REASON || `the request failed a check ([workflow log](${runUrl}))`}`,
                ``,
                `Please check the ticker symbol and try again.`,
              ].join('\n')
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'not_planned',
            });
